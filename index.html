<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard
  </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="assets.html">Assets</a>
    <a href="events.html">Events</a>
    <button type="button" id="logoutBtn">Logout</button>
  </nav>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">OPERATIONS / ASSET REGISTER</p>
      <h1>Dashboard</h1>
      <section id="dashboardStats" class="stats-grid" aria-label="Dashboard statistics">
        <article class="stat-card">
          <span class="stat-label">Total Aset</span>
          <strong id="totalAssetsStat" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Aset Sedang Dipinjam</span>
          <strong id="inTransitAssetsStat" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Event Aktif</span>
          <strong id="activeEventsStat" class="stat-value">0</strong>
        </article>
      </section>
    </header>

    <section class="panel table-panel" aria-labelledby="event-log-title">
      <div class="panel-heading">
        <h2 id="event-log-title">Event Log</h2>
      </div>
      <div class="table-wrapper">
        <table id="eventLogTable">
          <thead>
            <tr>
              <th>Event Name</th>
              <th>Location</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="manifestModal" class="modal">
    <div class="modal-content" id="printArea">
      <h3>Event Manifest: <span id="manifestEventName"></span></h3>
      <div class="manifest-table-wrapper">
        <table style="width: 100%; text-align: left; margin-top: 1rem; border-collapse: collapse;" border="1">
          <thead>
            <tr>
              <th style="padding: 0.5rem;">[ ] OUT</th>
              <th style="padding: 0.5rem;">[ ] IN</th>
              <th style="padding: 0.5rem;">Item Name</th>
            </tr>
          </thead>
          <tbody id="manifestTableBody"></tbody>
        </table>
      </div>
      <div class="no-print" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button type="button" id="printManifestBtn">Print Manifest</button>
        <button type="button" id="closeManifestBtn" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
